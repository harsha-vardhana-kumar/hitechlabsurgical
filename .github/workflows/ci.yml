name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify the three production builds in Chromium
        run: npm run test:browser
      - name: Retain browser results and desktop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-browser-validation
          path: test-results/
          retention-days: 7
